<!DOCTYPE html>

<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Inox Cường Đặng</title>

<style>
body{
margin:0;
font-family:sans-serif;
background:#f5f5f5;
}

/* HEADER */
.header{
background:#0b5ed7;
color:#fff;
}

.header .top{
display:flex;
justify-content:space-between;
align-items:center;
padding:10px 20px;
}

.header input{
padding:8px;
width:250px;
border:none;
border-radius:5px;
}

nav{
display:flex;
gap:20px;
background:#084298;
padding:10px;
justify-content:center;
}

nav a{
color:#fff;
text-decoration:none;
font-size:14px;
}

/* TEST SECTION */
.test{
padding:30px;
text-align:center;
}
</style>

</head>

<body>

<!-- HEADER -->

<header class="header">
  <div class="top">
    <h2>INOX CƯỜNG ĐẶNG</h2>
    <input type="text" placeholder="Tìm sản phẩm...">
  </div>

  <nav>
    <a href="#">Trang chủ</a>
    <a href="#">Sản phẩm</a>
    <a href="#">Giới thiệu</a>
    <a href="#">Liên hệ</a>
  </nav>
</header>

<!-- TEST (để kiểm tra không bị trắng) -->

<div class="test">
  <h1>Web đã chạy 🚀</h1>
  <p>Tiếp theo sẽ thêm slider + sản phẩm</p>
</div>

</body>
</html>
